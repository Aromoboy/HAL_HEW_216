# 再コンパイルなしで調整可能なステージレベルのチューニング値
# planeZ は、スウィーツが出現する深度平面を制御する
planeZ = -5.0

# スポーンアンカーは3D座標のトリプル（x,y,z）をカンマ/セミコロン区切りで並べる
# 既存の spawnPoints は primary のエイリアスとして扱われる
spawnPointsPrimary = -8.0, 0.0, -5.0; 2.5, 0.0, -5.0
spawnPointsSecondary = 8.0, 0.0, -5.0; 1.25, 0.0, -5.0

# グローバルゲームプレイフェーズを進める高さ（メートル）
phaseThresholds = 5.0, 15.0, 30.0, 45.0

# フェーズごとに適用されるスコア乗数（フェーズ数 = 閾値 + 1）
phaseRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75

# ミニフェーズを進める高さ（メートル）
phaseMiniThresholds = 2.0, 10.0, 22.0, 37.0

# ミニフェーズごとに適用されるスコア乗数（ミニフェーズ数 = 閾値 + 1）
phaseMiniRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75

# 移動とピックアップエリアのチューニング。セル基準で指定し、cellSizeWorldを掛けて実際の距離を決める。
cellSizeWorld = 1.0
horizontalSpeedCellsPerSec = 10.0
verticalSpeedCellsPerSec = 12.0
pickupBoxWidthCells = 5.0
pickupBoxHeightCells = 5.0
pickupMaxDistance = 0.5
pickupOffsetMode = world-x
pickupOffsetLocalCells = 0.5, 0.0, 0.0

# ガイドラインを超えた際のタイムボーナス条件（秒数を 0 にすると無効）
heightBonusThreshold = 1.0
heightBonusSeconds = 5.0
backgroundTexture = Assets/Texture/Title.jpg
