# Box2D v3 runtime tuning parameters
# Adjust and reload the scene to try different behaviors.
# gravity: downward acceleration strength (m/s^2)
# subSteps: number of solver substeps per frame (higher = more stable, slower)
# linearDamping/angularDamping: default damping applied to bodies without explicit values
# defaultFriction: fallback friction for shapes when none is specified
# defaultRestitution: fallback restitution for shapes when none is specified
# restitutionThreshold: minimum impact speed that produces restitution (m/s). 0 disables.
# hitEventThreshold: minimum impact speed for hit events (m/s). 0 uses Box2D default.
# ccdSweets: enable Box2D bullet/continuous collision for sweets
# ccdSmallDynamics: enable continuous collision for small dynamic bodies
# ccdSmallDynamicThreshold: max collider size (meters) considered "small" when ccdSmallDynamics is true
# ccdPlayerProjectiles: enable continuous collision for player projectiles (tag contains "projectile")
gravity=5.5
subSteps=12
linearDamping=2.5
angularDamping=3.0
defaultFriction=0.9
defaultRestitution=0.0
restitutionThreshold=0
hitEventThreshold=0.0
ccdSweets=true
ccdSmallDynamics=false
ccdSmallDynamicThreshold=0.6
ccdPlayerProjectiles=true
