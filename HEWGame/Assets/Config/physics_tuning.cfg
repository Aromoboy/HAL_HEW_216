# プロトタイプ物理エンジンの重力/減衰調整
# 実行時にこれらの値を編集し、シーンを再起動して異なる挙動をテストしてください。
# gravity: 下方加速度の強さ (m/s^2)
# damping: 毎秒速度に適用される乗数 (0-1)
# penetrationTolerance: 接触押し出しを開始する深さ (m)
# restitution: 接触後に残す反発係数 (0-1)
# frictionStatic: 接地時の静止摩擦係数 (0-無制限)
# frictionDynamic: 接地時の動摩擦係数 (0-無制限)
# maxSlopeCos: 静止摩擦を適用する最大傾斜角の余弦 (0-1)。1.0で水平のみを許可
# maxRestitutionVelocity: 反発を計算する速度の上限 (m/s)。0で無効
# verticalSnapCos: 上向きに近い法線を地面として扱うための余弦しきい値 (0-1)。デフォルト0.96で緩やかな傾斜も接地扱い
# groundMinCos: 地面として安定扱いする最小法線余弦 (0-1)。デフォルト0.85でやや斜面でも安定判定
# baumgarteFactor: 貫通補正の緩和係数 (0-1)
# maxPenetrationCorrection: 1ステップで許容する最大押し戻し量 (m)。デフォルト0.5で食い込みを強めに解消
# minLinearSpeed: 線形速度をゼロ扱いする最小値 (m/s)。デフォルト0.03で微小な滑りを抑制
# minVerticalSpeed: 垂直速度をゼロ扱いする最小値 (m/s)。デフォルト0.02で微小上下動を抑制
# minTangentialSpeed: 接線速度をゼロ扱いする最小値 (m/s)。デフォルト0.02で接地振動を収束
gravity=9.8
damping=0.985
penetrationTolerance=0.013
restitution=0.5
frictionStatic=0.95
frictionDynamic=0.65
maxSlopeCos=1.0
maxRestitutionVelocity=20.0
verticalSnapCos=0.96
groundMinCos=0.85
baumgarteFactor=0.2
maxPenetrationCorrection=0.5
minLinearSpeed=0.03
minVerticalSpeed=0.02
minTangentialSpeed=0.02
