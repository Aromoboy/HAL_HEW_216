# プロトタイプ物理エンジンの重力/減衰調整
# 実行時にこれらの値を編集し、シーンを再起動して異なる挙動をテストしてください。
# gravity: 下方加速度の強さ (m/s^2)
# damping: 毎秒速度に適用される乗数 (0-1)
# penetrationTolerance: 接触押し出しを開始する深さ (m)
# restitution: 接触後に残す反発係数 (0-1)
# frictionStatic: 接地時の静止摩擦係数 (0-無制限)
# frictionDynamic: 接地時の動摩擦係数 (0-無制限)
# maxSlopeCos: 静止摩擦を適用する最大傾斜角の余弦 (0-1)。1.0で水平のみを許可
# maxRestitutionVelocity: 反発を計算する速度の上限 (m/s)。0で無効
# verticalSnapCos: 法線がこの余弦値以上なら上下にスナップする (0-1)
# groundMinCos: これ以上の余弦なら「地面」扱いにする (0-1)
# baumgarteFactor: 1フレームで何割のめり込みを補正するか
# maxPenetrationCorrection: 1フレームあたりの最大押し出し距離 (m)
# minLinearSpeed: この速度未満の水平速度をゼロにする
# minVerticalSpeed: この速度未満の鉛直速度をゼロにする
# minTangentialSpeed: 接線方向で静止摩擦を使う速度の上限
gravity=9.8
damping=0.985
penetrationTolerance=0.02
restitution=0.2
frictionStatic=0.85
frictionDynamic=0.65
maxSlopeCos=1.0
maxRestitutionVelocity=20.0
verticalSnapCos=0.96
groundMinCos=0.85
baumgarteFactor=0.2
maxPenetrationCorrection=0.5
minLinearSpeed=0.03
minVerticalSpeed=0.02
minTangentialSpeed=0.02
