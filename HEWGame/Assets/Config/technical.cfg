# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
loadModelTextures = 1
post.gamma = 2.2
post.saturation = 1.25
post.contrast = 1.0
post.fogColor = 0.8,0.85,0.9
post.fogStart = 15.0
post.fogRange = 40.0
post.vignetteStrength = 0.35
post.bloomThreshold = 0.8
post.bloomIntensity = 0.8
post.enableFog = false
post.enableVignette = true
post.enableBloom = true
post.fxaa.enable = true
post.fxaa.edgeThreshold = 0.22
post.fxaa.edgeThresholdMin = 0.11
post.fxaa.subpixelQuality = 0.33
lighting.mode = stylized
lighting.key.diffuse = 1.0, 1.0, 1.0, 1.0
lighting.key.dir = 0.0, 0.0, 1.0
lighting.fill.diffuse = 0.0, 0.0, 0.0, 0.0
lighting.fill.dir = 0.0, 0.0, 1.0
lighting.hemi.sky = 0.0, 0.0, 0.0, 0.0
lighting.hemi.ground = 0.0, 0.0, 0.0, 0.0
lighting.rim.color = 0.0, 0.0, 0.0, 0.0
lighting.rim.params = 0.0, 0.0, 0.0, 0.0
light.key.diffuse = 1.0, 1.0, 1.0, 1.0
light.key.dir = 0.0, 0.0, 1.0
light.fill.diffuse = 0.0, 0.0, 0.0, 0.0
light.fill.dir = 0.0, 0.0, 1.0
light.hemi.sky = 0.0, 0.0, 0.0, 0.0
light.hemi.ground = 0.0, 0.0, 0.0, 0.0
light.rim.color = 0.0, 0.0, 0.0, 0.0
light.rim.params = 0.0, 0.0, 0.0, 0.0
