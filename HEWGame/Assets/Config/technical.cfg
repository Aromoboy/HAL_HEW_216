# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
loadModelTextures = 1
post.gamma = 2.2
post.saturation = 1.25
post.contrast = 1.0
post.fogColor = 0.8,0.85,0.9
post.fogStart = 15.0
post.fogRange = 40.0
post.vignetteStrength = 0.35
post.bloomThreshold = 0.8
post.bloomIntensity = 0.8
post.enableFog = false
post.enableVignette = true
post.enableBloom = true
post.fxaa.enable = true
post.fxaa.edgeThreshold = 0.22
post.fxaa.edgeThresholdMin = 0.11
post.fxaa.subpixelQuality = 0.33
lighting.mode = stylized
lighting.key.diffuse = 1.0, 1.0, 1.0, 0.25
lighting.key.dir = 0.0, 0.0, 1.0
lighting.key.wrap = 0.70
lighting.fill.diffuse = 1.0, 0.98, 0.95, 0.18
lighting.fill.dir = -0.3, 0.0, 1.0
lighting.fill.wrap = 0.90
lighting.hemi.sky = 0.90, 0.95, 1.00, 1.0
lighting.hemi.ground = 0.75, 0.80, 0.85, 0.0
lighting.rim.color = 1.0, 1.0, 1.0, 0.1
lighting.rim.params = 3.0, 0.0, 0.0, 1.0
lighting.rim.enable = true
