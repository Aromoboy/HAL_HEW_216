# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
# モデル読み込み時にテクスチャを読み込むかどうか（0/falseで軽量化、1/trueで本来の見た目）
loadModelTextures = 1
# 画面全体のガンマ補正（1.0で補正なし、1.2〜2.2で明暗の持ち上げ/締め）
post.gamma = 1.0
# 彩度（1.0=標準、1.2で彩度強め、0.8で淡く）
post.saturation = 1.2
# コントラスト（1.0=標準、1.1で強め、0.9で弱め）
post.contrast = 1.05
# フォグ色（RGB 0〜1）
post.fogColor = 0.8,0.85,0.9
# フォグ開始距離（カメラからの距離）
post.fogStart = 15.0
# フォグの影響範囲（大きいほど緩やか）
post.fogRange = 40.0
# 周辺減光の強さ（0で無効、0.2〜0.4が目安）
post.vignetteStrength = 0.25
# ブルーム発光の閾値（明るい部分のみ発光）
post.bloomThreshold = 0.85
# ブルーム強度（0で無効）
post.bloomIntensity = 0.35
# フィルムグレイン量（0で無効、0.01〜0.05が目安）
post.grain.amount = 0.02
# フィルムグレインを有効化
post.grain.enable = true
# フィルムグレインを時間変化させる（揺らぎ）
post.grain.animate = true
# 距離フォグを有効化
post.enableFog = false
# 周辺減光を有効化
post.enableVignette = true
# ブルームを有効化
post.enableBloom = true
# FXAA を有効化（アンチエイリアス）
post.fxaa.enable = true
# FXAA: エッジ検出の強さ（高いほど閾値が厳しい）
post.fxaa.edgeThreshold = 0.22
# FXAA: 最低閾値（細かいエッジの拾い具合）
post.fxaa.edgeThresholdMin = 0.11
# FXAA: サブピクセル品質（0〜1、上げると滑らか）
post.fxaa.subpixelQuality = 0.33
# マテリアル・プロファイル（光の反応/SSSのプリセット）
material.profile.cream.lightResponse = 1.05
# SSS強度（半透明感）
material.profile.cream.sssIntensity = 0.18
# SSS色（RGB 0〜1）
material.profile.cream.sssColor = 1.0, 0.93, 0.90
material.profile.strawberry.lightResponse = 1.04
material.profile.strawberry.sssIntensity = 0.1
material.profile.strawberry.sssColor = 1.0, 0.72, 0.78
material.profile.blueberry.lightResponse = 1.02
material.profile.blueberry.sssIntensity = 0.08
material.profile.blueberry.sssColor = 0.72, 0.76, 1.0
material.profile.pineapple.lightResponse = 1.03
material.profile.pineapple.sssIntensity = 0.09
material.profile.pineapple.sssColor = 1.0, 0.96, 0.72
material.profile.banana.lightResponse = 1.02
material.profile.banana.sssIntensity = 0.07
material.profile.banana.sssColor = 1.0, 0.95, 0.82
material.profile.cake.lightResponse = 1.03
material.profile.cake.sssIntensity = 0.08
material.profile.cake.sssColor = 1.0, 0.95, 0.92
material.profile.osara.lightResponse = 1.0
material.profile.osara.sssIntensity = 0.02
material.profile.osara.sssColor = 1.0, 1.0, 1.0
material.profile.character.lightResponse = 1.06
material.profile.character.sssIntensity = 0.12
material.profile.character.sssColor = 1.0, 0.95, 1.0
material.profile.sweets.lightResponse = 1.02
material.profile.sweets.sssIntensity = 0.06
material.profile.sweets.sssColor = 1.0, 0.95, 0.9
# マテリアルの割り当て（モデルの materialKey → 使用するプロファイル名）
material.override.cream = cream
material.override.strawberry = strawberry
material.override.blueberry = blueberry
material.override.pineapple = pineapple
material.override.banana = banana
material.override.cake = cake
material.override.osara = osara
material.override.sweets = sweets
material.override.player = character
material.override.fairy = character
# ライティングモード（stylized / lambert または 0/1）
lighting.mode = stylized
# Keyライト（主光源）: 色RGB + 強度(α)
lighting.key.diffuse = 1.0, 1.0, 1.0, 0.5
# Keyライト方向（XYZ）
lighting.key.dir = 0.2, -0.2, 1.0
# Keyライトの回り込み（0で通常Lambert、0.5〜1.0で柔らかめ）
lighting.key.wrap = 0.75
# Keyライトを有効化
lighting.key.enable = true
# Fillライト（補助光）: 色RGB + 強度(α)
lighting.fill.diffuse = 1.0, 0.98, 0.95, 0.2
# Fillライト方向（XYZ）
lighting.fill.dir = -0.3, 0.1, 1.0
# Fillライトの回り込み
lighting.fill.wrap = 0.95
# Fillライトを有効化
lighting.fill.enable = true
# 天空ライト（上方向）: 色RGB + 強度(α)
lighting.hemi.sky = 0.90, 0.95, 1.00, 0.6
# 地面ライト（下方向）: 色RGB + 強度(α)
lighting.hemi.ground = 0.75, 0.80, 0.85, 0.4
# リムライト色 + 強度(α)
lighting.rim.color = 1.0, 1.0, 1.0, 0.2
# リムライト設定（x=リム幅/強度の調整、w=有効フラグ用）
lighting.rim.params = 3.0, 0.0, 0.0, 1.0
# リムライトを有効化
lighting.rim.enable = true
# ブロブシャドウ（簡易影）を有効化
shadow.blob.enable = true
# デバッグ用: 深度テストを無効化して影を前面表示
shadow.blob.debugNoDepthTest = false
# 影の濃さ（0〜1）
shadow.blob.opacity = 0.35
# 影のぼかし（0〜1）
shadow.blob.softness = 0.4
# 高さに応じた影の縮小が最大になる高さ
shadow.blob.maxHeight = 6.0
# 高さ最大時の最小スケール
shadow.blob.minScale = 0.35
# 影の地面からの浮き（Zファイト回避）
shadow.blob.receiverBias = 0.01
# 影を落とす地面のY座標
shadow.blob.groundY = 0.0
# shadow.blob.groundZ = 0.0
