# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
# モデル読み込み時にテクスチャを読み込むかどうか（0/falseで軽量化、1/trueで本来の見た目）
loadModelTextures = 1

# =========================
# Post-Processing　--- Tone & Color
# 明るさ・色味・コントラストの全体調整
# ※画面全体にかかる後処理エフェクト
# ※モニターの特性や色設定によって、明るさ・色味の見え方が変わる場合がある
# =========================
post.gamma = 1.0 # sRGB出力を前提（手動ガンマ補正なし、1.0固定）
post.saturation = 2.5 # 彩度（1.0=標準）
post.contrast = 1.1 # コントラスト（1.0=標準）

# =========================
# --- Distance Fog ---
# 距離による色のフェード（奥行き表現用、今はレイヤーがないのでオフにしてある）
# =========================
post.enableFog = false # 距離フォグを有効化
post.fogColor = 0.8,0.85,0.9 # フォグ色（RGB 0〜1）
post.fogStart = 15.0 # フォグ開始距離（カメラからの距離）
post.fogRange = 40.0 # フォグの影響範囲（大きいほど緩やか）

# =========================
# --- Vignette ---
# 画面端の減光（視線誘導）
# =========================
post.enableVignette = true # 周辺減光を有効化
post.vignetteStrength = 0.25 # 周辺減光の強さ

# =========================
# --- Bloom ---
# 明るい部分のにじみ表現
# =========================
post.enableBloom = true # ブルームを有効化
post.bloomThreshold = 0.8 # ブルーム発光の閾値（明るい部分のみ発光）
post.bloomIntensity = 0.8 # ブルーム強度（0で無効）

# =========================
# --- Film Grain ---
# フィルムノイズ風の質感付加
# =========================
post.grain.enable = true # フィルムグレインを有効化
post.grain.animate = true # フィルムグレインを時間変化させる（揺らぎ）
post.grain.amount = 0.02 # フィルムグレイン量

# =========================
# --- Anti-Aliasing (FXAA) ---
# 輪郭のギザギザ軽減
# =========================
post.fxaa.enable = true # FXAAを有効化（アンチエイリアス）
post.fxaa.edgeThreshold = 0.22 # エッジ検出の強さ（高いほど閾値が厳しい）
post.fxaa.edgeThresholdMin = 0.11 # 最低閾値（細かいエッジの拾い具合）
post.fxaa.subpixelQuality = 0.33 # サブピクセル品質（0〜1、上げると滑らか）

# =========================
# Material Profiles
# マテリアルごとの光とSSS（半透明感）の特性定義
# SSS（Subsurface Scattering）: 光が内部で拡散する表現（柔らかさ・透け感）
# =========================
material.profile.cream.lightResponse = 1.05 # 光への反応の強さ（値を上げると明暗がくっきりする）
material.profile.cream.sssIntensity = 0.18 # SSSの強さ（逆光時の透け感）
material.profile.cream.sssColor = 1.0, 0.93, 0.90 # SSSの色（内部からの光の色）
material.profile.strawberry.lightResponse = 1.04
material.profile.strawberry.sssIntensity = 0.1
material.profile.strawberry.sssColor = 1.0, 0.72, 0.78
material.profile.blueberry.lightResponse = 1.02
material.profile.blueberry.sssIntensity = 0.08
material.profile.blueberry.sssColor = 0.72, 0.76, 1.0
material.profile.pineapple.lightResponse = 1.03
material.profile.pineapple.sssIntensity = 0.09
material.profile.pineapple.sssColor = 1.0, 0.96, 0.72
material.profile.banana.lightResponse = 1.02
material.profile.banana.sssIntensity = 0.07
material.profile.banana.sssColor = 1.0, 0.95, 0.82
material.profile.kiwi.lightResponse = 1.03
material.profile.kiwi.sssIntensity = 0.08
material.profile.kiwi.sssColor = 0.82, 1.0, 0.78
material.profile.mikan.lightResponse = 1.04
material.profile.mikan.sssIntensity = 0.1
material.profile.mikan.sssColor = 1.0, 0.84, 0.6
material.profile.muscat.lightResponse = 1.03
material.profile.muscat.sssIntensity = 0.09
material.profile.muscat.sssColor = 0.86, 1.0, 0.82
material.profile.melon.lightResponse = 1.02
material.profile.melon.sssIntensity = 0.08
material.profile.melon.sssColor = 0.9, 1.0, 0.85
material.profile.cake.lightResponse = 1.03
material.profile.cake.sssIntensity = 0.08
material.profile.cake.sssColor = 1.0, 0.95, 0.92
material.profile.osara.lightResponse = 1.0
material.profile.osara.sssIntensity = 0.02
material.profile.osara.sssColor = 1.0, 1.0, 1.0
material.profile.character.lightResponse = 1.06
material.profile.character.sssIntensity = 0.12
material.profile.character.sssColor = 1.0, 0.95, 1.0
material.profile.sweets.lightResponse = 1.02
material.profile.sweets.sssIntensity = 0.06
material.profile.sweets.sssColor = 1.0, 0.95, 0.9

# マテリアルの割り当て（モデルのmaterialKey→ 使用するプロファイル名、基本的にプログラマー向けの設定）
material.override.cream = cream
material.override.strawberry = strawberry
material.override.blueberry = blueberry
material.override.pineapple = pineapple
material.override.banana = banana
material.override.kiwi = kiwi
material.override.mikan = mikan
material.override.muscat = muscat
material.override.melon = melon
material.override.cake = cake
material.override.osara = osara
material.override.sweets = sweets
material.override.player = character
material.override.fairy = character
material.override.guideline = sweets

# =========================
# --- Lighting Mode ---
# stylized: 現行仕様 / lambert: 旧方式
# =========================
lighting.mode = stylized # ライティングモード（stylized か lambert。lambertのほうが古くて念のために残してある）

# =========================
# --- Key Light ---
# メインとなる光源。形と陰影を作る基本のライト
# =========================
lighting.key.enable = true # Keyライトを有効化
lighting.key.diffuse = 1.0, 1.0, 1.0, 0.5 # Keyライト（主光源）: 色RGB + 強度(α)
lighting.key.dir = 0.2, -0.2, 1.0 # Keyライト方向（XYZ）
lighting.key.wrap = 0.75 # Keyライトの回り込み（0で通常Lambert、0.5〜1.0で柔らかめ）

# =========================
# --- Fill Light ---
# 影を潰しすぎないための補助光。Keyでできた暗部を持ち上げる
# =========================
lighting.fill.enable = true # Fillライトを有効化
lighting.fill.diffuse = 1.0, 0.98, 0.95, 0.2 # Fillライト（補助光）: 色RGB + 強度(α)
lighting.fill.dir = -0.3, 0.1, 1.0 # Fillライト方向（XYZ）
lighting.fill.wrap = 0.95 # Fillライトの回り込み

# =========================
# --- Hemisphere Light ---
# 環境光。上方向（sky,空）と下方向（ground,地面）からの間接光を表現
# 影を完全な黒にせず、全体を自然に見せるための光
# =========================
lighting.hemi.sky = 0.90, 0.95, 1.00, 0.6 # 天空ライト（上方向）: 色RGB + 強度(α)
lighting.hemi.ground = 0.75, 0.80, 0.85, 0.4 # 地面ライト（下方向）: 色RGB + 強度(α)

# =========================
# --- Rim Light ---
# カメラ反対側から当たる縁取り用の光
# =========================
lighting.rim.enable = true # リムライトを有効化
lighting.rim.color = 1.0, 1.0, 1.0, 0.2 # リムライト色 + 強度(α)
lighting.rim.params = 3.0, 0.0, 0.0, 1.0 # リムライト設定（x=リム幅/強度の調整、w=有効フラグ用）

# =========================
# Shadow (Blob Shadow)
# 簡易的な接地影表現
# =========================
shadow.blob.enable = false # ブロブシャドウ（簡易影）を有効化
shadow.blob.debugNoDepthTest = false # デバッグ用: 深度テストを無効化して影を前面表示
shadow.blob.opacity = 0.35 # 影の濃さ（0〜1）
shadow.blob.softness = 0.4 # 影のぼかし（0〜1）
shadow.blob.maxHeight = 6.0 # 高さに応じた影の縮小が最大になる高さ
shadow.blob.minScale = 0.35 # 高さ最大時の最小スケール
shadow.blob.receiverBias = 0.01 # 影の地面からの浮き（Zファイト回避）
shadow.blob.groundY = 0.0 # 影を落とす地面のY座標

# =========================
# --- Scene Transition Fade ---
# シーン切り替え時の画面フェード設定
# =========================
[render.fade]
enable = true # フェードを有効化
fadeInSeconds = 0.5 # フェードインの秒数
fadeOutSeconds = 0.5 # フェードアウトの秒数
holdSeconds = 0.4 # フェードアウト後のホールド秒数（任意）
color = 0.55, 0.90, 0.92 # フェード色（RGB 0〜1）
easing = linear # linear / smoothstep / easein / easeout / easeinout

# =========================
# --- Window Settings ---
# 起動時のウィンドウサイズ（未指定時は作業領域から取得）
# =========================
[window.settings]
width = 1280
height = 720
