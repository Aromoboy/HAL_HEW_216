# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
loadModelTextures = 1
post.gamma = 2.2
post.saturation = 1.25
post.contrast = 1.0
post.fogColor = 0.8,0.85,0.9
post.fogStart = 15.0
post.fogRange = 40.0
post.vignetteStrength = 0.35
post.bloomThreshold = 0.8
post.bloomIntensity = 0.8
post.enableFog = false
post.enableVignette = true
post.enableBloom = true
post.fxaa.enable = true
post.fxaa.edgeThreshold = 0.166
post.fxaa.edgeThresholdMin = 0.0833
post.fxaa.subpixelQuality = 0.75
