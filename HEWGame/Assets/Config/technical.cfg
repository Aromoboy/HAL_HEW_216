# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
loadModelTextures = 1
post.gamma = 2.2
post.saturation = 0.85
post.contrast = 1.1
post.fogColor = 0.8,0.85,0.9
post.fogStart = 15.0
post.fogRange = 40.0
post.vignetteStrength = 1.2
post.bloomThreshold = 0.8
post.bloomIntensity = 0.15
post.enableFog = false
post.enableVignette = true
post.enableBloom = true
