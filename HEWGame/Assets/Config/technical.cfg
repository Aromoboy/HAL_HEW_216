# レンダリングとシステムの切り替え

[render.settings]
# モデルインポート時にテクスチャの読み込みをスキップするには、loadModelTexturesを0に設定してください
# モデル読み込み時にテクスチャを読み込むかどうか（0/falseで軽量化、1/trueで本来の見た目）
loadModelTextures = 1

# =========================
# Post-Processing　--- Tone & Color
# 明るさ・色味・コントラストの全体調整
# ※画面全体にかかる後処理エフェクト
# ※モニターの特性や色設定によって、明るさ・色味の見え方が変わる場合がある
# =========================
post.gamma = 1.4 # 画面全体のガンマ補正（1.0で補正なし）
post.saturation = 2 # 彩度（1.0=標準）
post.contrast = 0.9 # コントラスト（1.0=標準）

# =========================
# --- Distance Fog ---
# 距離による色のフェード（奥行き表現用、今はレイヤーがないのでオフにしてある）
# =========================
post.enableFog = false # 距離フォグを有効化
post.fogColor = 0.8,0.85,0.9 # フォグ色（RGB 0〜1）
post.fogStart = 15.0 # フォグ開始距離（カメラからの距離）
post.fogRange = 40.0 # フォグの影響範囲（大きいほど緩やか）

# =========================
# --- Vignette ---
# 画面端の減光（視線誘導）
# =========================
post.enableVignette = true # 周辺減光を有効化
post.vignetteStrength = 0.25 # 周辺減光の強さ

# =========================
# --- Bloom ---
# 明るい部分のにじみ表現
# =========================
post.enableBloom = true # ブルームを有効化
post.bloomThreshold = 0.8 # ブルーム発光の閾値（明るい部分のみ発光）
post.bloomIntensity = 0.8 # ブルーム強度（0で無効）

# =========================
# --- Film Grain ---
# フィルムノイズ風の質感付加
# =========================
post.grain.enable = true # フィルムグレインを有効化
post.grain.animate = true # フィルムグレインを時間変化させる（揺らぎ）
post.grain.amount = 0.02 # フィルムグレイン量

# =========================
# --- Anti-Aliasing (FXAA) ---
# 輪郭のギザギザ軽減
# =========================
post.fxaa.enable = true # FXAAを有効化（アンチエイリアス）
post.fxaa.edgeThreshold = 0.22 # エッジ検出の強さ（高いほど閾値が厳しい）
post.fxaa.edgeThresholdMin = 0.11 # 最低閾値（細かいエッジの拾い具合）
post.fxaa.subpixelQuality = 0.33 # サブピクセル品質（0〜1、上げると滑らか）

# =========================
# --- Lighting Mode ---
# stylized: 現行仕様 / lambert: 旧方式
# =========================
lighting.mode = stylized # ライティングモード（stylized か lambert。lambertのほうが古くて念のために残してある）

# =========================
# --- Key Light ---
# メインとなる光源。形と陰影を作る基本のライト
# =========================
lighting.key.enable = true # Keyライトを有効化
lighting.key.diffuse = 1.0, 1.0, 1.0, 0.5 # Keyライト（主光源）: 色RGB + 強度(α)
lighting.key.dir = 0.2, -0.2, 1.0 # Keyライト方向（XYZ）
lighting.key.wrap = 0.75 # Keyライトの回り込み（0で通常Lambert、0.5〜1.0で柔らかめ）

# =========================
# --- Fill Light ---
# 影を潰しすぎないための補助光。Keyでできた暗部を持ち上げる
# =========================
lighting.fill.enable = true # Fillライトを有効化
lighting.fill.diffuse = 1.0, 0.98, 0.95, 0.2 # Fillライト（補助光）: 色RGB + 強度(α)
lighting.fill.dir = -0.3, 0.1, 1.0 # Fillライト方向（XYZ）
lighting.fill.wrap = 0.95 # Fillライトの回り込み

# =========================
# --- Hemisphere Light ---
# 環境光。上方向（sky,空）と下方向（ground,地面）からの間接光を表現
# 影を完全な黒にせず、全体を自然に見せるための光
# =========================
lighting.hemi.sky = 0.90, 0.95, 1.00, 0.6 # 天空ライト（上方向）: 色RGB + 強度(α)
lighting.hemi.ground = 0.75, 0.80, 0.85, 0.4 # 地面ライト（下方向）: 色RGB + 強度(α)

# =========================
# --- Rim Light ---
# カメラ反対側から当たる縁取り用の光
# =========================
lighting.rim.enable = true # リムライトを有効化
lighting.rim.color = 1.0, 1.0, 1.0, 0.2 # リムライト色 + 強度(α)
lighting.rim.params = 3.0, 0.0, 0.0, 1.0 # リムライト設定（x=リム幅/強度の調整、w=有効フラグ用）

# =========================
# Shadow (Blob Shadow)
# 簡易的な接地影表現
# =========================
shadow.blob.enable = true # ブロブシャドウ（簡易影）を有効化
shadow.blob.debugNoDepthTest = false # デバッグ用: 深度テストを無効化して影を前面表示
shadow.blob.opacity = 0.35 # 影の濃さ（0〜1）
shadow.blob.softness = 0.4 # 影のぼかし（0〜1）
shadow.blob.maxHeight = 6.0 # 高さに応じた影の縮小が最大になる高さ
shadow.blob.minScale = 0.35 # 高さ最大時の最小スケール
shadow.blob.receiverBias = 0.01 # 影の地面からの浮き（Zファイト回避）
shadow.blob.groundY = 0.0 # 影を落とす地面のY座標

# =========================
# --- Scene Transition Fade ---
# シーン切り替え時の画面フェード設定
# =========================
[render.fade]
enable = true # フェードを有効化
fadeInSeconds = 0.5 # フェードインの秒数
fadeOutSeconds = 0.5 # フェードアウトの秒数
holdSeconds = 0.4 # フェードアウト後のホールド秒数（任意）
color = 0.55, 0.90, 0.92 # フェード色（RGB 0〜1）
easing = linear # linear / smoothstep / easein / easeout / easeinout
