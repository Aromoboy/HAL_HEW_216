# Collider definition for player character
# Designers can adjust the radius/points/offset without recompiling. Supported shapes mirror colliders_sweets.cfg
# Available keys should match the sweets manifest key for the Fairy entry (default: Fairy).
# Set forceConfigCollider=true to bypass generated hulls from the model and always use this definition (default: false).

forceConfigCollider=false

collider=Fairy
shape=circle
radius=0.38
thickness=0.3
margin=0.0
