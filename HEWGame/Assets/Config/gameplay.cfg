[physics.tuning]
gravity=19.0
subSteps=12
linearDamping=2.5
angularDamping=3.0
defaultFriction=0.9
defaultRestitution=0.0
restitutionThreshold=0
hitEventThreshold=0.0
ccdMeteors=true
ccdSmallDynamics=true
ccdSmallDynamicThreshold=0.6
ccdPlayerProjectiles=true
ccdPlayer=true
creamGlueLinearHertz=0.0
creamGlueLinearDampingRatio=0.7
creamGlueAngularHertz=0.0
creamGlueAngularDampingRatio=0.7
creamGlueCollideConnected=false
creamGluePushOutEpsilon=0.03
creamGlueMaxPushOut=0.25
creamGlueMaxSpeed=3.0
creamGlueBreakForce=0.0
creamGlueBreakImpulse=4.0
# deprecated:
# creamWeldLinearHertz
# creamWeldLinearDampingRatio
# creamWeldAngularHertz
# creamWeldAngularDampingRatio
# creamWeldCollideConnected

[player.transform]
# position = x, y, z
# scale = x, y, z
position = 0.0, 0.0, 0.0
rotationDegrees = 90.0, 180.0, 180.0
# yawOffsetDegrees compensates for player model forward axis (tweak 90/180 as needed).
yawOffsetDegrees = -90.0
# missileYawOffsetDegrees compensates for the base model nose axis (tweak 90/180 as needed).
missileYawOffsetDegrees = -90.0
scale = 0.0250, 0.0250, 0.0250
# missileSpawnOffset = x, y, z (local)
missileSpawnOffset = 1.5, 0.0, 0.0

[missile.settings]
# scale = x, y, z
scale = 1.250, 1.0250, 1.0250
# rotationOffset = radians
rotationOffset = 1.570796
# collider half extents
halfWidth = 0.2
halfHeight = 0.1
# physics material
density = 1.0
friction = 0.1
restitution = 0.0
# body dynamics
fixedRotation = true
linearDamping = 0.0
angularDamping = 0.0
gravityScale = 0.0
# collisionLayer is optional (default if omitted)
collisionLayer = default

[camera.rig]
# mode は gameplay では無視されるため、Fixed/Cinematic はメニュー/タイトル側で設定する
minY = -1000.0
maxY = 1000.0
# followSpeed は指数平滑化の速度係数（1秒あたり）です
followSpeed = 5.0
comfortZoneTopPercentY = 0.1
comfortZoneBottomPercentY = 0.1
followSpeedY = 5.0
offsetY = 0.0
offset = 0.0, 5.5, -25.0
fovDegrees = 45.0
yawDegrees = 0.0
pitchDegrees = -10.0

[stage.checklist]

planeZ = -5.0
spawnPoints = -11.0, 0.0, -4.0; -11.0, 0.0, -4.0
spawnPointsSecondary = 10.0, 0.0, -4.0; 10.0, 0.0, -4.0

phaseThresholds = 5.0, 15.0, 25.0, 35.0
phaseRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75
phaseMiniThresholds = 2.0, 10.0, 22.0, 37.0
phaseMiniRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75

cellSizeWorld = 1.0
horizontalSpeedCellsPerSec = 10.0
verticalSpeedCellsPerSec = 12.0
backgroundTexture = Assets/Texture/background.png
background.safeScrollY = 65.0
background.safeWindow = 12.0
background.softness = 8.0

[spawn.phases]

phase=0
interval=3.0
simultaneous=7
burstInterval=0.5
initialPerLane=6
phaseStartBonusPerLane=2
weights=Mercury:1.0,Meteor:1.0,Meteorite:0.8

phase=1
interval=2.2
simultaneous=12
burstInterval=0.5
phaseStartBonusPerLane=2
weights=Mercury:1.2,Meteor:1.3,Meteorite:1.0

phase=2
