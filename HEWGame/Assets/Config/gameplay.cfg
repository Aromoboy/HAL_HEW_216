entry=Blueberry,Assets/Model/blueberry.fbx,Juicy blueberry fruit mesh with baked vertex colors
entry=Pineapple,Assets/Model/pineapple.fbx,Detailed pineapple fruit with crown and textured skin
entry=Banana,Assets/Model/banana.fbx,Curved banana fruit with stylized proportions
