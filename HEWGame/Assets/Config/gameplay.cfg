simultaneous=20
burstInterval=0.5
phaseStartBonusPerLane=2
weights=Mercury:1.8,Meteor:1.6,Meteorite:1.1

[spawn.growth]
growthIntervalSeconds=20
growthStep=1

[meteors.manifest]
entry=Mercury,Assets/Model/Mercury.fbx,Mercury-like meteor sphere with cratered surface
entry=Meteor,Assets/Model/meteor.fbx,Jagged meteor with rocky ridges
entry=Meteorite,Assets/Model/Meteorite.fbx,Meteorite chunk with fractured outer crust

