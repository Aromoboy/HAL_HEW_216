# Gameplay configuration: physics, stage pacing, spawn phases, powerups, and collider presets.

[physics.tuning]
# Box2D v3 runtime tuning parameters
# Adjust and reload the scene to try different behaviors.
# gravity: downward acceleration strength (m/s^2)
# subSteps: number of solver substeps per frame (higher = more stable, slower)
# linearDamping/angularDamping: default damping applied to bodies without explicit values
# defaultFriction: fallback friction for shapes when none is specified
# defaultRestitution: fallback restitution for shapes when none is specified
# restitutionThreshold: minimum impact speed that produces restitution (m/s). 0 disables.
# hitEventThreshold: minimum impact speed for hit events (m/s). 0 uses Box2D default.
# ccdSweets: enable Box2D bullet/continuous collision for sweets
# ccdSmallDynamics: enable continuous collision for small dynamic bodies
# ccdSmallDynamicThreshold: max collider size (meters) considered "small" when ccdSmallDynamics is true
# ccdPlayerProjectiles: enable continuous collision for player projectiles (tag contains "projectile")
gravity=9.8
subSteps=12
linearDamping=2.5
angularDamping=3.0
defaultFriction=0.9
defaultRestitution=0.0
restitutionThreshold=0
hitEventThreshold=0.0
ccdSweets=true
ccdSmallDynamics=false
ccdSmallDynamicThreshold=0.6
ccdPlayerProjectiles=true

[player.transform]
# Player transform relative to the gameplay plane.
# position = x, y, z (z is added to the plate/stage plane depth)
# rotationDegrees = pitch, yaw, roll in degrees
# scale = x, y, z
position = 0.0, 5.0, 0.0
rotationDegrees = 0.0, 90.0, 0.0
scale = 0.250, 0.250, 0.250

[stage.checklist]
# Regression checklist stage tuned for visual/physics alignment
# - Platform top aligns to world Y=0 so groundY can be read directly from debug logs.
# - Pivot tweaks are visual-only; collider sizing stays in Box2D defaults.

planeZ = -5.0

# Primary spawn lanes (x,y,z). Secondary is optional via spawnPointsSecondary/spawnPointsB.
spawnPoints = -16.0, 0.0, -5.0; 2.5, 0.0, -5.0
spawnPointsSecondary = 8.0, 0.0, -5.0; 1.25, 0.0, -5.0

# guidelineHeight/guidelineStep と同じ間隔に揃えてフェーズとボーナスラインを同期させる
phaseThresholds = 5.0, 15.0, 25.0, 35.0
phaseRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75
phaseMiniThresholds = 2.0, 10.0, 22.0, 37.0
phaseMiniRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75

cellSizeWorld = 1.0
horizontalSpeedCellsPerSec = 10.0
verticalSpeedCellsPerSec = 12.0
pickupBoxWidthCells = 5.0
pickupBoxHeightCells = 5.0
pickupMaxDistance = 0.5
pickupOffsetMode = world-x
pickupOffsetLocalCells = 0.5, 0.0, 0.0

heightBonusThreshold = 1.0
heightBonusSeconds = 5.0
guidelineHeight = 5.0
guidelineStep = 10.0
guidelineThicknessPixels = 3.0
guidelineWidthPaddingWorld = 4.0
guidelineZOffset = 0.1
backgroundTexture = Assets/Texture/Title.jpg

[spawn.phases]
# Spawn pacing configuration for sweets per height phase.
# Each block defines one phase: phase index, spawn interval, simultaneous spawns, and weights.

phase=0
interval=3.0
simultaneous=7
burstInterval=0.5
initialPerLane=6
phaseStartBonusPerLane=2
weights=Cream:1.0,Strawberry:1.0,Blueberry:1.0,Pineapple:0.8

phase=1
interval=2.2
simultaneous=12
burstInterval=0.5
phaseStartBonusPerLane=2
weights=Cream:1.5,Strawberry:1.2,Blueberry:1.3,Pineapple:1.0

phase=2
interval=1.4
simultaneous=20
burstInterval=0.5
phaseStartBonusPerLane=2
weights=Cream:2.0,Strawberry:1.8,Blueberry:1.6,Pineapple:1.1

