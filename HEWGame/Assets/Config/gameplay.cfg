# Gameplay configuration: colliders, player tuning, stage presets, and sweets factory.

[colliders.registry]
# Collider registry definitions (shared by player/sweets/stage).
collider=Cake
shape=box
width=0.30
height=0.30
offset=0.0,0.0
density=1.20
friction=0.65
restitution=0.03

collider=Cream
shape=circle
radius=0.6
offset=0.0,0.5
density=0.60
friction=1.10
restitution=0.00
linearDamping=3.0

collider=Strawberry
shape=circle
radius=0.6
offset=0.0,-0.25
density=1.40
friction=1.25
restitution=0.00
linearDamping=3.0

collider=Blueberry
shape=circle
radius=0.5
offset=0.0,0.5
density=1.70
friction=1.5
restitution=0.00
linearDamping=3.0

collider=Pineapple
shape=box
width=0.78
height=1.1
offset=0.5,0.5
density=1.05
friction=1.35
restitution=0.00
linearDamping=3.0

collider=Banana
shape=capsule
radius=0.09
height=0.45
offset=0.0,0.0
density=0.95
friction=1.30
restitution=0.00
linearDamping=3.0

collider=Fairy
shape=box
width=0.78
height=1.1
offset=0.0,0.65
density=0.55
friction=0.40
restitution=0.06

collider=CakeStage
shape=box
width=9.00
height=5.20
density=0.00
friction=1.00
restitution=0.02

collider=OsaraStage
shape=box
width=7.00
height=0.80
density=0.00
friction=0.95
restitution=0.02

[colliders.player]
# Player collider overrides.
forceConfigCollider=false

collider=Fairy
shape=circle
radius=0.35
thickness=0.30
margin=0.0

[colliders.player.tuning]
# Padding/offset tuning for player collider generation.
thicknessPadding=1.15
padding=0.02,0.05,0.02
offset=0.0,0.1,0.0
fallbackPadding=0.02,0.05,0.02
fallbackOffset=0.0,0.05,0.0
fallbackSize=0.6,0.9,0.12

[colliders.stage]
# Stage collider presets.
preset=Cake
modelKey=cake.fbx
registryId=CakeStage
layer=Floor
bodyType=static
fixedRotation=true
allowRotation=false
offset=0,0

preset=Osara
modelKey=osara.fbx
registryId=OsaraStage
layer=Floor
bodyType=static
fixedRotation=true
allowRotation=false
offset=0,0

[colliders.sweets.factory]
# Sweets factory presets.
preset=Cream
spawnWeight=1
scale=0.4,0.4,0.4
colliderPreset=circle
padding=0.003,0.003,0.003

preset=Strawberry
spawnWeight=1
scale=0.5,0.5,0.5
colliderPreset=circle
padding=0.006,0.006,0.006

preset=Blueberry
spawnWeight=1
scale=0.18,0.18,0.18
colliderPreset=circle
padding=0.008,0.008,0.008

preset=Pineapple
spawnWeight=0.8
scale=0.2,0.2,0.2
colliderPreset=box
padding=0.01,0.016,0.01

preset=Banana
spawnWeight=0.9
scale=0.32,0.32,0.32
colliderPreset=capsule
padding=0.005,0.005,0.005
