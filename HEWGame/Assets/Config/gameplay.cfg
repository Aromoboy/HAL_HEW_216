entry=Timer,AdditiveAbsolute,linear,0.0,5.0
entry=Whip,FeatureToggle,toggle

[sweets.lifecycle]
# スイーツのライフサイクル設定
sweets.outOfBoundsDespawn=true # 画面外でデスポーン
sweets.outOfBoundsRespawn=true # 画面外で再出現
sweets.outOfBoundsRespawnDelay=4.0 # 再出現までの待機秒
sweets.grabRespawnDelay=20.0 # 取得後の再出現待機秒

