[physics.tuning]
# 物理挙動の全体調整（ゲームプレイ用）
gravity=19.0 # 重力加速度（値を上げると落下が速くなる）
subSteps=12 # 1フレーム内の物理計算回数（安定性と負荷の調整）
linearDamping=2.5 # 線形速度の減衰（空気抵抗の強さ）
angularDamping=3.0 # 回転速度の減衰（回転の止まりやすさ）
defaultFriction=0.9 # 既定の摩擦係数（滑りやすさの基準）
defaultRestitution=0.0 # 既定の反発係数（跳ね返りの強さ）
restitutionThreshold=0 # 反発が有効になる速度しきい値
hitEventThreshold=0.0 # ヒットイベントを発火する速度しきい値
ccdSweets=true # スイーツにCCD（高速衝突検出）を有効化
ccdSmallDynamics=true # 小型ダイナミクスにCCDを適用
ccdSmallDynamicThreshold=0.6 # CCD対象とする小型判定のしきい値
ccdPlayer=true # プレイヤーにCCDを有効化
creamGlueLinearHertz=0.0 # クリーム接着の線形バネ周波数
creamGlueLinearDampingRatio=0.7 # クリーム接着の線形ダンピング比
creamGlueAngularHertz=0.0 # クリーム接着の角度バネ周波数
creamGlueAngularDampingRatio=0.7 # クリーム接着の角度ダンピング比
creamGlueCollideConnected=false # 接着済み同士の衝突を許可するか
creamGluePushOutEpsilon=0.03 # 接着時のめり込み許容誤差
creamGlueMaxPushOut=0.25 # 接着時の最大押し戻し距離
creamGlueMaxSpeed=3.0 # 接着時の最大相対速度
creamGlueBreakForce=0.0 # 接着が切れる力のしきい値（0で無効）
creamGlueBreakImpulse=4.0 # 接着が切れる衝撃量のしきい値
# deprecated: # 廃止済みパラメータ（互換のため残置）
# creamWeldLinearHertz # 旧クリーム接合：線形バネ周波数
# creamWeldLinearDampingRatio # 旧クリーム接合：線形ダンピング比
# creamWeldAngularHertz # 旧クリーム接合：角度バネ周波数
# creamWeldAngularDampingRatio # 旧クリーム接合：角度ダンピング比
# creamWeldCollideConnected # 旧クリーム接合：接合同士の衝突可否

[player.transform]
# プレイヤー初期Transform
# position = x, y, z # 位置（ワールド座標）
# scale = x, y, z # スケール倍率
position = 0.0, 5.0, 0.0 # 初期位置
rotationDegrees = 0.0, 90.0, 0.0 # 初期回転（度数）
scale = 0.250, 0.250, 0.250 # 初期スケール

[camera.rig]
# カメラ追従リグ設定
# mode は gameplay では無視されるため、Fixed/Cinematic はメニュー/タイトル側で設定する # モードの運用メモ
minY = -1000.0 # カメラYの下限
maxY = 1000.0 # カメラYの上限
# followSpeed は指数平滑化の速度係数（1秒あたり）です # 追従の滑らかさ
followSpeed = 5.0 # 追従速度（X/Z）
comfortZoneTopPercentY = 0.1 # 上側の快適ゾーン比率
comfortZoneBottomPercentY = 0.1 # 下側の快適ゾーン比率
followSpeedY = 5.0 # 追従速度（Y）
offsetY = 0.0 # 追加のYオフセット
offset = 0.0, 5.5, -25.0 # カメラの相対オフセット
fovDegrees = 45.0 # 視野角
yawDegrees = 0.0 # ヨー角
pitchDegrees = -10.0 # ピッチ角

[stage.checklist]
# ステージ進行に関わる基本設定

planeZ = -5.0 # ステージ基準面のZ位置
spawnPoints = -11.0, 0.0, -4.0; -11.0, 0.0, -4.0 # 生成ポイント（主）
spawnPointsSecondary = 10.0, 0.0, -4.0; 10.0, 0.0, -4.0 # 生成ポイント（副）

phaseThresholds = 5.0, 15.0, 25.0, 35.0 # フェーズ切替の高さしきい値
phaseRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75 # フェーズごとの報酬倍率

cellSizeWorld = 1.0 # 1セルのワールドサイズ
horizontalSpeedCellsPerSec = 10.0 # 横移動速度（セル/秒）
verticalSpeedCellsPerSec = 12.0 # 縦移動速度（セル/秒）
pickupBoxWidthCells = 5.0 # ピックアップ判定の幅（セル）
pickupBoxHeightCells = 5.0 # ピックアップ判定の高さ（セル）
pickupMaxDistance = 0.5 # ピックアップ可能な最大距離
pickupOffsetMode = world-x # ピックアップ位置の補正モード
pickupOffsetLocalCells = 0.5, 0.0, 0.0 # ローカル補正量（セル）

guidelineHeight = 20.0 # 20＝10メートル（フェーズライン開始高さ）
guidelineStep = 20.0 # 20＝20メートル（フェーズラインの上昇幅）
guidelineThicknessWorld = 1.00 # フェーズラインの厚み
guidelineWidthPaddingWorld = 4.0 # フェーズライン左右の余白
guidelineZOffset = 0.1 # フェーズラインのZオフセット
guidelineSpinAxis = 1.0, 0.0, 0.0 # 回転軸
guidelineSpinSpeedDegPerSec = 30.0 # 回転速度（度/秒）
guidelineModelPath = Assets/Model/GuideLine.fbx # モデルパス
guidelineMaterialKey = guideline # 使用マテリアル
guidelineTimeBonusSeconds = 5.0 # 通過時のタイムボーナス
guidelineMilestoneBonusSeconds = 30.0 # マイルストーン到達ボーナス
guidelineMilestoneInterval = 5 # マイルストーン間隔（回数）
backgroundTexture = Assets/Texture/background.png # 背景テクスチャ

[spawn.limits]
# 生成数の上限
spawnPerPointCap = 6 # 1ポイントあたりの上限
spawnPerPointInitial = 3 # 1ポイントあたりの初期数
spawnTotalCap = 12 # 全体の同時出現上限

[spawn.tuning]
# 生成テンポの調整
spawnIntervalSeconds = 2.5 # 通常生成の間隔（秒）
burstIntervalSeconds = 0.5 # バースト生成の間隔（秒）
simultaneousSpawnCount = 1 # 同時生成数
simultaneousLiveTarget = 1 # 同時生存ターゲット数
weights = Cream:1.0, Strawberry:1.0, Kiwi:1.0, Mikan:1.0, Muscat:1.0, Melon:1.0, Blueberry:1.0, Pineapple:1.0, Banana:1.0 # 出現ウェイト

[powerups]
entry=移動速度,捜査キャラの移動速度が速くなる！,SpeedUp,10,200,0,1.2
entry=提供速度,フルーツがもっと運ばれてくる！,SweetsSpawnSpeed,10,200,0,1.2
entry=フルーツ提供量,一度に運ばれるフルーツの量が増える！,SweetsSpawnQuantity,5,150,10,2.0
entry=もらえるポイント,より多くのポイントがもらえるようになる！,PointAmount,1,2000,-2000,0.0
entry=タイマー強化,タイマーが+5秒/レベルで増える！,Timer,5,300,300,1.0
entry=ホイップ追加,たまにホイップが運ばれてくるようになる!,Whip,1,1000,-1000,0.0

[powerup.effects]
