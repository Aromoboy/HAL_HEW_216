[physics.tuning]
gravity=19.0
subSteps=12
linearDamping=2.5
angularDamping=3.0
defaultFriction=0.9
defaultRestitution=0.0
restitutionThreshold=0
hitEventThreshold=0.0
ccdSweets=true
ccdSmallDynamics=true
ccdSmallDynamicThreshold=0.6
ccdPlayer=true
creamGlueLinearHertz=0.0
creamGlueLinearDampingRatio=0.7
creamGlueAngularHertz=0.0
creamGlueAngularDampingRatio=0.7
creamGlueCollideConnected=false
creamGluePushOutEpsilon=0.03
creamGlueMaxPushOut=0.25
creamGlueMaxSpeed=3.0
creamGlueBreakForce=0.0
creamGlueBreakImpulse=4.0
# deprecated:
# creamWeldLinearHertz
# creamWeldLinearDampingRatio
# creamWeldAngularHertz
# creamWeldAngularDampingRatio
# creamWeldCollideConnected

[player.transform]
# position = x, y, z
# scale = x, y, z
position = 0.0, 5.0, 0.0
rotationDegrees = 0.0, 90.0, 0.0
scale = 0.250, 0.250, 0.250

[camera.rig]
# mode は gameplay では無視されるため、Fixed/Cinematic はメニュー/タイトル側で設定する
minY = -1000.0
maxY = 1000.0
# followSpeed は指数平滑化の速度係数（1秒あたり）です
followSpeed = 5.0
comfortZoneTopPercentY = 0.1
comfortZoneBottomPercentY = 0.1
followSpeedY = 5.0
offsetY = 0.0
offset = 0.0, 5.5, -25.0
fovDegrees = 45.0
yawDegrees = 0.0
pitchDegrees = -10.0

[stage.checklist]

planeZ = -5.0
spawnPoints = -11.0, 0.0, -4.0; -11.0, 0.0, -4.0
spawnPointsSecondary = 10.0, 0.0, -4.0; 10.0, 0.0, -4.0

phaseThresholds = 5.0, 15.0, 25.0, 35.0
phaseRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75
phaseMiniThresholds = 2.0, 10.0, 22.0, 37.0
phaseMiniRewardMultipliers = 1.0, 1.15, 1.3, 1.5, 1.75

cellSizeWorld = 1.0
horizontalSpeedCellsPerSec = 10.0
verticalSpeedCellsPerSec = 12.0
pickupBoxWidthCells = 5.0
pickupBoxHeightCells = 5.0
pickupMaxDistance = 0.5
pickupOffsetMode = world-x
pickupOffsetLocalCells = 0.5, 0.0, 0.0

guidelineHeight = 20.0 #20＝10メートル
guidelineStep = 20.0 #20＝20メートル
guidelineThicknessWorld = 1.00
guidelineWidthPaddingWorld = 4.0
guidelineZOffset = 0.1
guidelineSpinAxis = 1.0, 0.0, 0.0
guidelineSpinSpeedDegPerSec = 30.0
guidelineModelPath = Assets/Model/GuideLine.fbx
guidelineMaterialKey = guideline
guidelineTimeBonusSeconds = 5.0
guidelineMilestoneBonusSeconds = 30.0
guidelineMilestoneInterval = 5
backgroundTexture = Assets/Texture/background.png

[spawn.limits]
spawnPerPointCap = 6
spawnPerPointInitial = 3
spawnTotalCap = 12

[spawn.phases]
phase=0, initial_per_lane=3
phase=1, simultaneous=8, live_target=8

[powerups]
entry=SpeedUp,PlayerSpeedUp,SpeedUp,10,200,0,1.2
entry=CakeSize,CakeSizeUp,CakeSize,5,150,10,2.0
entry=Whip,GetWhip,Whip,1,2000,-2000,0.0

[sweets.lifecycle]
sweets.outOfBoundsDespawn=true
sweets.outOfBoundsRespawn=true
sweets.outOfBoundsRespawnDelay=4.0
sweets.grabRespawnDelay=20.0

