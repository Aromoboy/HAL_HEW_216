# Collider definitions for sweets cross-sections
# Supported shapes: circle, hull, compound
# Optional tuning: apply `scale` and `margin` per collider or child (e.g. `children=circle:0.45@0,0|scale=0.9|margin=-0.02`)

collider=Cake
shape=hull
points=-0.5,-0.3;0.5,-0.3;0.5,0.3;-0.5,0.3
thickness=1.0

collider=Pudding
shape=hull
points=-0.5,-0.35;0.5,-0.35;0.0,0.35
