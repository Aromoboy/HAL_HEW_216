# Collider definitions for sweets cross-sections
# Generated polygon decompositions / convex hulls from meshes are preferred by default.
# Enable `SweetsManager::SetColliderConfigOverridesEnabled(true)` to force these definitions
# to override generated colliders, or call `SetForceGeneratedColliders(true)` to always
# ignore config shapes and rely solely on generated contours (falls back to AABB if missing).
# Supported shapes: circle, hull, compound
# Optional tuning: apply `scale` and `margin` per collider or child (e.g. `children=circle:0.45@0,0|scale=0.9|margin=-0.02`)

collider=Cake
