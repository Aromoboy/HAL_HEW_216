# Regression checklist stage tuned for visual/physics alignment
# - Platform top aligns to world Y=0 so groundY can be read directly from debug logs.
# - Spawn anchors sit on the plate top to confirm there is no hidden blocking line.
# - Pivot tweaks are visual-only; collider sizing stays in Box2D defaults.

