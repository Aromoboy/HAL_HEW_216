# Plate offsets (meters) for tuning lateral margins and spawn height.
osara_left_offset_x = 0.0
osara_right_offset_x = 0.0
osara_offset_y = 0.0
osara_spawn_offset_y = 0.0

# Platform center is offset so its top rests on world Y=0.
