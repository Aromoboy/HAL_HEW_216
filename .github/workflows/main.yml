name: シビュラ レビュー通知

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Discord に通知を送信
        uses: Ilshidur/action-discord@v2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            {
              "embeds": [
                {
                  "title": "🔔 シビュラ通知：新しいコメントがあります",
                  "description": "**イベント:** ${{ github.event_name }}\n**リポジトリ:** ${{ github.repository }}\n**投稿者:** ${{ github.actor }}\n\n**コメントへのリンク:** ${{ github.event.comment.html_url || github.event.review.html_url }}",
                  "color": 5814783
                }
              ]
            }
