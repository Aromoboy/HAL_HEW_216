name: シビュラ レビュー通知

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Discord に通知
        uses: adambirds/github-discord-notifications@v2.2.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: "シビュラ"
          avatar-url: "https://i.imgur.com/Op5bEU2.png"
