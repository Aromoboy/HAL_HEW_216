name: シビュラ通知

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Discord に通知
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
          AUTHOR: ${{ github.actor }}
          ASSIGNEE_LOGIN: ${{ github.event.issue.assignee.login || github.event.pull_request.assignee.login }}
          LINK: ${{ github.event.comment.html_url || github.event.review.html_url || github.event.issue.html_url || github.event.pull_request.html_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK secret が設定されていません"; exit 1;
          fi

          echo "DEBUG: ASSIGNEE_LOGIN = '$ASSIGNEE_LOGIN'"

          # GitHub の Aromoboy → Discord の <@224551705080102913>
          MENTION=""
          if [ "$ASSIGNEE_LOGIN" = "Aromoboy" ]; then
            MENTION="<@224551705080102913>"
          fi

          BODY=$(printf '%s' \
            "{\"content\": \"🔔 シビュラ通知: 新しいコメントがあります。\n担当: $ASSIGNEE_LOGIN $MENTION\nイベント: $EVENT_NAME\n投稿者: $AUTHOR\nリンク: $LINK\"}"
          )

          echo "送信ペイロード:"
          echo "$BODY"

          curl -sS -H "Content-Type: application/json" \
               -X POST \
               -d "$BODY" \
               "$WEBHOOK_URL"
